<!-- Image reveal card · motion-card-image-reveal: from the Motion: Animated cards (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/motion-cards.css, and an ancestor with class="cx-motion-cards". -->
<div class="cx-motion-cards"><div class="w-full">
<article class="demo reveal-demo" id="reveal-demo">
       <div class="demo-head"><span class="demo-number">04 / MASK</span>
        <h2 class=" demo-title" style="color: rgb(236, 240, 232); font-weight: 600; font-style: normal; font-size: 24px;">Image Reveal</h2>
        <p class=" demo-description" style="color: rgb(194, 206, 196); font-weight: 400; font-style: normal; font-size: 13px;">A circular mask uncovers a CSS-painted landscape.</p>
       </div>
       <div class="stage">
        <div class="sample reveal-sample">
         <div class="reveal-art"></div><strong>Beyond the frame.</strong><small>Touch to uncover</small>
        </div><button id="reveal-trigger" class="reveal-trigger" type="button" aria-label="Reveal landscape artwork" aria-pressed="false"></button>
       </div>
      </article>
</div></div>
<script>
(() => {
document.getElementById('reveal-trigger').addEventListener('click',e=>{
      const active=document.getElementById('reveal-demo').classList.toggle('is-active');
      e.currentTarget.setAttribute('aria-pressed',String(active));
    });
})();
</script>
