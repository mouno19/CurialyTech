<!-- Monthly milestones (spotlight bars, dark) · chart-bar-spotlight: from the Analytics Component Library (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/atlas-paper.css, and an ancestor with class="cx-atlas-paper". -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<div class="cx-atlas-paper">
<article class="panel dark-bar-card">
        <div class="panel-head">
         <div>
          <h3>Monthly milestones</h3>
          <p class="panel-caption">New customers · a focused editorial style</p>
         </div><span class="badge">Spotlight</span>
        </div>
        <div class="chart-wrap">
         <canvas id="spotlight-bar-chart" role="img" aria-label="Vertical bar chart of new customers from January to June, highlighting June at 740"></canvas>
        </div>
       </article>
</div>
<script>
Chart.defaults.font.family='"DM Sans", sans-serif';
Chart.defaults.font.size=11;
Chart.defaults.color='#838d85';
const axis={grid:{color:'#edf0e9'},border:{display:false},ticks:{padding:9}};
const noGrid={grid:{display:false},border:{display:false},ticks:{padding:9}};
new Chart(document.getElementById('spotlight-bar-chart'),{
      type:'bar',data:{labels:['Jan','Feb','Mar','Apr','May','Jun'],datasets:[{label:'New customers',data:[390,445,480,560,625,740],backgroundColor:['#526d5f','#526d5f','#526d5f','#526d5f','#526d5f','#f2735d'],hoverBackgroundColor:'#a5dbc6',borderRadius:8,barPercentage:.56}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{...noGrid,ticks:{color:'#c0d1c5',padding:9}},y:{...axis,grid:{color:'#3c4b42'},ticks:{color:'#c0d1c5',padding:9}}}}
    });
</script>
