<!-- Trending cards with rank numerals (Shonen Hub) · anime-shonen-trending: from the Anime archetype: Shonen Hub (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/anime-action-shonen-hub.css, and an ancestor with class="cx-anime-action-shonen-hub". -->
<script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
<div class="cx-anime-action-shonen-hub">
<section id="trending" class="section" aria-labelledby="trending-title">
     <div class="section-head">
      <div>
       <div class="section-kicker">
        The arena is heating up
       </div>
       <h2 id="trending-title" class="section-title">TRENDING <span>BATTLES</span></h2>
       <p class="section-sub">The clashes everyone is talking about.</p>
      </div><a class="section-link" href="#discover">Explore all <i data-lucide="arrow-up-right"></i></a>
     </div>
     <div id="trending-grid" class="card-grid"></div>
    </section>
</div>
<script>
lucide.createIcons();
const series=[
      {id:"fallen",title:"Blade of the Fallen Sun",genre:"Action · Fantasy",rating:"9.4",episodes:"24 episodes",status:"Complete",badge:"No. 1 trending",image:"https://images.pexels.com/photos/30526809/pexels-photo-30526809.jpeg",alt:"A captivating portrait of a samurai cosplayer with a sword, backlit by an intense red glow, creating an artistic ambiance.",description:"When the last light fades, lone swordsman Ren Akatsuki stands between the living world and an empire of shadows. His greatest battle may be against the power awakening within him."},
      {id:"crimson",title:"Crimson Vow",genre:"Action · Adventure",rating:"9.2",episodes:"18 episodes",status:"Ongoing",badge:"New episode",image:"https://images.pexels.com/photos/32175668/pexels-photo-32175668.jpeg",alt:"Dramatic portrait of a woman in cosplay with a katana against a striking red background.",description:"A rebel swordswoman races across fractured kingdoms to break an ancient curse before the final eclipse. Every victory brings her closer to the truth about her own past."},
      {id:"shadow",title:"Shadowbound",genre:"Fantasy · Action",rating:"9.1",episodes:"9 episodes",status:"Ongoing",badge:"Fan favorite",image:"https://images.pexels.com/photos/19249701/pexels-photo-19249701.jpeg",alt:"A hooded warrior in dark armor stands outside holding a sword beneath a cloudy sky.",description:"Bound to a forgotten kingdom's darkest secret, a wandering knight must decide whether to save the throne or destroy it for good."},
      {id:"storm",title:"Stormbreaker",genre:"Adventure · Fantasy",rating:"9.0",episodes:"26 episodes",status:"Complete",badge:"Top rated",image:"https://images.pexels.com/photos/29426270/pexels-photo-29426270.jpeg",alt:"Viking warrior woman in artistic makeup standing strong.",description:"Guardian Vera Storm crosses the wild frontier to unite rival clans against a force that can command the skies."},
      {id:"azure",title:"Azure Pulse",genre:"Action · Adventure",rating:"8.9",episodes:"12 episodes",status:"Ongoing",badge:"New episode",image:"https://images.pexels.com/photos/13132532/pexels-photo-13132532.jpeg",alt:"Woman in anime cosplay posing with long blue wig against vibrant blue backdrop.",description:"Aoi Kira discovers an electric power she cannot control and joins a tournament where every challenger knows more about her origins than she does."},
      {id:"mist",title:"Mist & Steel",genre:"Fantasy · Adventure",rating:"8.8",episodes:"16 episodes",status:"Complete",badge:"Hidden gem",image:"https://images.pexels.com/photos/7780085/pexels-photo-7780085.jpeg",alt:"Elegant geisha in traditional kimono poses with a sword amidst swirling mist.",description:"A master of the mist blade follows a trail of vanished warriors into a realm where memory is the most dangerous weapon."},
      {id:"night",title:"Nightfall Order",genre:"Action · Fantasy",rating:"8.7",episodes:"20 episodes",status:"Ongoing",badge:"Ongoing",image:"https://images.pexels.com/photos/30526808/pexels-photo-30526808.jpeg",alt:"Aesthetic portrait of an Asian woman in cosplay with a sword and dramatic black and red lighting.",description:"An elite order hunts creatures born from broken promises, while one new recruit questions the oath that holds them together."},
      {id:"iron",title:"Iron Horizon",genre:"Adventure · Action",rating:"8.6",episodes:"22 episodes",status:"Complete",badge:"Epic journey",image:"https://images.pexels.com/photos/32764752/pexels-photo-32764752.jpeg",alt:"Cosplay enthusiast posing in dynamic action scene in nature.",description:"Beyond the last known border, an unlikely crew searches for the legendary city at the edge of the world."}
    ];
function card(item,index){return `<article class="anime-card"><div class="card-image-wrap"><img id="card-image-${item.id}" class="card-image" src="${item.image}" alt="${item.alt}" loading="lazy"><span class="card-badge">${item.badge}</span><span class="card-number">${String(index+1).padStart(2,"0")}</span></div><div class="card-body"><div class="card-genre">${item.genre}</div><h3 class="card-title">${item.title}</h3><div class="card-bottom"><span>${item.status} · ${item.episodes}</span><span class="rating"><i data-lucide="star"></i> ${item.rating}</span></div></div><button class="card-open" type="button" data-series="${item.id}" aria-label="Explore ${item.title}">Explore ${item.title}</button></article>`}
document.getElementById("trending-grid").innerHTML=series.slice(0,4).map(card).join("");
</script>
