<!-- Daily order range (floating bars) · chart-bar-range: from the Analytics Component Library (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/atlas-paper.css, and an ancestor with class="cx-atlas-paper". -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<div class="cx-atlas-paper">
<article class="panel">
        <div class="panel-head">
         <div>
          <h3>Daily order range</h3>
          <p class="panel-caption">Low to high volume across the working week</p>
         </div><span class="badge warn">Floating</span>
        </div>
        <div class="chart-wrap">
         <canvas id="range-bar-chart" role="img" aria-label="Floating bars showing low-to-high daily orders from Monday to Friday"></canvas>
        </div>
       </article>
</div>
<script>
Chart.defaults.font.family='"DM Sans", sans-serif';
Chart.defaults.font.size=11;
Chart.defaults.color='#838d85';
const axis={grid:{color:'#edf0e9'},border:{display:false},ticks:{padding:9}};
const noGrid={grid:{display:false},border:{display:false},ticks:{padding:9}};
new Chart(document.getElementById('range-bar-chart'),{
      type:'bar',data:{labels:['Mon','Tue','Wed','Thu','Fri'],datasets:[{label:'Order range',data:[[45,90],[55,105],[38,82],[64,118],[72,135]],backgroundColor:['#a5dbc6','#72bb9a','#f3ca78','#3e8e71','#f2735d'],borderRadius:7,barPercentage:.52}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>'Low '+ctx.raw[0]+' · High '+ctx.raw[1]+' orders'}}},scales:{x:noGrid,y:{...axis,min:0,max:150}}}
    });
</script>
