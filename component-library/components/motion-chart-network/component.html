<!-- Connected network · motion-chart-network: from the Motion: Animated data visualizations (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/motion-charts.css, and an ancestor with class="cx-motion-charts". -->
<div class="cx-motion-charts"><div class="app-shell">
<article class=" chart-card" style="background: rgb(25, 37, 34);">
      <div class="card-top"><span class="chart-number">09</span>
       <div>
        <h2 style="color: rgb(240, 243, 233); font-weight: 700; font-style: normal; font-size: 21px;">Connected network</h2>
        <p class=" card-desc" style="color: rgb(165, 184, 174); font-weight: 400; font-style: normal; font-size: 14px;">Select a node to trace its relationships.</p>
       </div>
      </div>
      <svg id="network" class="viz" role="img" aria-label="Interactive network of connected services"></svg>
     </article>
</div></div>
<script>
(() => {
const NS='http://www.w3.org/2000/svg';
const samples={
    saas:{label:'SaaS growth',series:[28,35,32,48,55,53,72,86],categories:[46,78,61,91,55],segments:[45,27,18,10],radial:[86,72,64,91],kpi:78,heat:Array.from({length:42},(_,i)=>((i*17+Math.floor(i/7)*11)%91)+9),pulse:[40,49,44,58,52,65,58,73,68,76,72,83],funnel:[12000,7200,3100,980]},
    finance:{label:'Financial outlook',series:[42,38,47,45,59,68,64,79],categories:[83,62,75,48,67],segments:[38,31,20,11],radial:[74,89,68,82],kpi:84,heat:Array.from({length:42},(_,i)=>((i*23+Math.floor(i/7)*7)%88)+12),pulse:[55,50,62,57,65,59,72,69,79,74,77,85],funnel:[18600,10400,4700,1650]},
    ai:{label:'AI platform',series:[18,22,37,42,57,66,81,94],categories:[72,88,56,79,63],segments:[51,25,16,8],radial:[93,78,85,69],kpi:91,heat:Array.from({length:42},(_,i)=>((i*31+Math.floor(i/7)*13)%90)+10),pulse:[25,39,35,51,48,64,59,75,72,81,79,92],funnel:[24000,13200,5900,2200]}
  };
const colors=['#a5efca','#ff9b82','#f2d486','#82b3db','#bba9e8'];
const state={data:structuredClone(samples.saas),selected:null,live:null};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function svg(id){const el=document.getElementById(id),w=Math.max(300,Math.round(el.getBoundingClientRect().width)),h=Math.round(el.getBoundingClientRect().height)||230;el.setAttribute('viewBox',`0 0 ${w} ${h}`);el.replaceChildren();return {el,w,h}}
function node(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));if(parent)parent.appendChild(e);return e}
function txt(p,x,y,text,extra={}){const e=node('text',{x,y,...extra},p);e.textContent=text;return e}
function tip(el,text){node('title',{},el).textContent=text}
function animate(el,attrs,duration=850,delay=0){if(reduce){Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));return}setTimeout(()=>{el.style.transition=`all ${duration}ms cubic-bezier(.22,.8,.22,1)`;requestAnimationFrame(()=>Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v)))},delay)}
const networkNodes=[['API',.19,.46],['Auth',.39,.20],['Events',.43,.75],['Analytics',.64,.42],['Billing',.81,.17],['AI',.82,.74]];
const links=[[0,1],[0,2],[0,3],[1,3],[1,4],[2,3],[2,5],[3,4],[3,5]];
function networkChart(){const {el,w,h}=svg('network'),coords=networkNodes.map(([,x,y])=>[35+x*(w-70),18+y*(h-36)]);links.forEach(([a,b],i)=>{const line=node('line',{x1:coords[a][0],y1:coords[a][1],x2:coords[a][0],y2:coords[a][1],stroke:'#638f7a','stroke-width':2,'data-edge':`${a}-${b}`},el);animate(line,{x2:coords[b][0],y2:coords[b][1]},500,i*70)});networkNodes.forEach(([name],i)=>{const [x,y]=coords[i],g=node('g',{tabindex:0,role:'button','aria-label':`${name} node; highlight connections`,class:'network-node','data-node':i},el);const c=node('circle',{cx:x,cy:y,r:0,fill:i===3?colors[0]:colors[3],stroke:'#192522','stroke-width':3},g);tip(g,name);animate(c,{r:i===3?12:9},420,i*90);txt(g,x,y+27,name,{'text-anchor':'middle'});g.addEventListener('click',()=>{state.selected=state.selected===i?null:i;highlightNetwork()});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();g.dispatchEvent(new Event('click'))}})});highlightNetwork()}
function highlightNetwork(){const s=state.selected,el=document.getElementById('network');el.querySelectorAll('[data-edge]').forEach(e=>{const [a,b]=e.getAttribute('data-edge').split('-').map(Number);e.style.opacity=s===null||a===s||b===s?'1':'.15';e.setAttribute('stroke',s!==null&&(a===s||b===s)?colors[0]:'#638f7a')});el.querySelectorAll('[data-node]').forEach(e=>{const n=Number(e.getAttribute('data-node'));e.style.opacity=s===null||n===s||links.some(([a,b])=>a===s&&b===n||b===s&&a===n)?'1':'.28';e.setAttribute('aria-pressed',String(n===s))})}
networkChart();
})();
</script>
