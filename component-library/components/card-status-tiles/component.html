<!-- Status tiles · card-status-tiles: from the Analytics Component Library (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/atlas-paper.css, and an ancestor with class="cx-atlas-paper". -->
<script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
<div class="cx-atlas-paper">
<div class="grid three" style="margin-bottom:16px">
      <div class="panel status-card"><span class="status-icon"><i data-lucide="database"></i></span>
       <div>
        <h3>12 connected sources</h3>
        <p>Across four workspaces</p>
       </div>
      </div>
      <div class="panel status-card"><span class="status-icon"><i data-lucide="circle-check"></i></span>
       <div>
        <h3>99.8% sync success</h3>
        <p>Over the last 30 days</p>
       </div>
      </div>
      <div class="panel status-card"><span class="status-icon"><i data-lucide="clock-3"></i></span>
       <div>
        <h3>1.2s average latency</h3>
        <p>Within the expected range</p>
       </div>
      </div>
     </div>
</div>
<script>
lucide.createIcons();
</script>
