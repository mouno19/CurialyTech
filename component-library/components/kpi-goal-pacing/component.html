<!-- Goal pacing bars · kpi-goal-pacing: from the Analytics Component Library (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/atlas-paper.css, and an ancestor with class="cx-atlas-paper". -->
<div class="cx-atlas-paper">
<div class="panel">
        <h3>Goal pacing</h3>
        <p class="panel-caption">Current progress against team targets</p>
        <div style="margin-top:27px">
         <div class="progress-caption">
          <strong>Revenue</strong><span>78% of target</span>
         </div>
         <div class="progress-line" role="progressbar" aria-label="Revenue target" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100">
          <span style="width:78%"></span>
         </div>
        </div>
        <div style="margin-top:25px">
         <div class="progress-caption">
          <strong>New customers</strong><span>64% of target</span>
         </div>
         <div class="progress-line" role="progressbar" aria-label="New customers target" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100">
          <span style="width:64%;background:var(--coral)"></span>
         </div>
        </div>
        <div style="margin-top:25px">
         <div class="progress-caption">
          <strong>Retention</strong><span>89% of target</span>
         </div>
         <div class="progress-line" role="progressbar" aria-label="Retention target" aria-valuenow="89" aria-valuemin="0" aria-valuemax="100">
          <span style="width:89%;background:var(--yellow)"></span>
         </div>
        </div>
       </div>
</div>
