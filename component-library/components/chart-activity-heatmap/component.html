<!-- Activity density heatmap · chart-activity-heatmap: from the Analytics Component Library (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/atlas-paper.css, and an ancestor with class="cx-atlas-paper". -->
<div class="cx-atlas-paper">
<div class="panel">
        <div class="panel-head">
         <div>
          <h3>Activity density</h3>
          <p class="panel-caption">A compact heatmap for recurring behavior</p>
         </div><span class="badge coral">Last 8 weeks</span>
        </div>
        <div id="activity-heatmap" class="heat-days" role="img" aria-label="Activity heatmap showing varied activity across eight weeks"></div>
        <div class="heat-labels"><span>8 weeks ago</span><span>Today</span>
        </div>
       </div>
</div>
<script>
const heatLevels=[0,1,2,1,3,2,0,1,2,3,4,2,1,0,2,1,3,3,4,2,1,0,1,2,2,3,1,0,2,3,4,3,2,1,0,1,2,3,2,4,3,1,0,2,2,3,4,3,2,1,1,3,4,2,3,4];
document.getElementById('activity-heatmap').innerHTML=heatLevels.map(level=>`<span class="heat-cell" data-level="${level}" aria-hidden="true"></span>`).join('');
</script>
