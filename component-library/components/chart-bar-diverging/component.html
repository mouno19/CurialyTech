<!-- Change in direction (diverging bars) · chart-bar-diverging: from the Analytics Component Library (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/atlas-paper.css, and an ancestor with class="cx-atlas-paper". -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<div class="cx-atlas-paper">
<article class="panel">
        <div class="panel-head">
         <div>
          <h3>Change in direction</h3>
          <p class="panel-caption">Percent change by channel · gains and declines</p>
         </div><span class="badge coral">Diverging</span>
        </div>
        <div class="chart-wrap">
         <canvas id="diverging-bar-chart" role="img" aria-label="Diverging horizontal bar chart showing organic plus 24 percent, direct plus 12 percent, paid minus 7 percent, and referral minus 15 percent"></canvas>
        </div>
       </article>
</div>
<script>
Chart.defaults.font.family='"DM Sans", sans-serif';
Chart.defaults.font.size=11;
Chart.defaults.color='#838d85';
const axis={grid:{color:'#edf0e9'},border:{display:false},ticks:{padding:9}};
const noGrid={grid:{display:false},border:{display:false},ticks:{padding:9}};
new Chart(document.getElementById('diverging-bar-chart'),{
      type:'bar',data:{labels:['Organic','Direct','Paid','Referral'],datasets:[{label:'Change',data:[24,12,-7,-15],backgroundColor:ctx=>ctx.raw>=0?'#3e8e71':'#f2735d',borderRadius:5,barPercentage:.55}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>(ctx.raw>0?'+':'')+ctx.raw+'%'}}},scales:{x:{...axis,min:-20,max:30,ticks:{callback:v=>v+'%',padding:9}},y:noGrid}}
    });
</script>
