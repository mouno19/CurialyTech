<!-- Audience by device (donut) · chart-device-donut: from the Analytics Component Library (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/atlas-paper.css, and an ancestor with class="cx-atlas-paper". -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<div class="cx-atlas-paper">
<div class="panel">
        <div class="panel-head">
         <div>
          <h3>Audience by device</h3>
          <p class="panel-caption">Share of sessions by device type</p>
         </div>
        </div>
        <div class="chart-wrap short">
         <canvas id="device-chart" role="img" aria-label="Doughnut chart of mobile, desktop and tablet sessions"></canvas>
        </div>
        <div class="legend-list">
         <div class="legend-item"><span><i class="dot" style="background:#f2735d"></i>Mobile</span><strong>62%</strong>
         </div>
         <div class="legend-item"><span><i class="dot" style="background:#3e8e71"></i>Desktop</span><strong>31%</strong>
         </div>
         <div class="legend-item"><span><i class="dot" style="background:#f3ca78"></i>Tablet</span><strong>7%</strong>
         </div>
        </div>
       </div>
</div>
<script>
Chart.defaults.font.family='"DM Sans", sans-serif';
Chart.defaults.font.size=11;
Chart.defaults.color='#838d85';
new Chart(document.getElementById('device-chart'),{
      type:'doughnut',
      data:{labels:['Mobile','Desktop','Tablet'],datasets:[{data:[62,31,7],backgroundColor:['#f2735d','#3e8e71','#f3ca78'],borderWidth:0,spacing:4,borderRadius:5}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'72%',plugins:{legend:{display:false}}}
    });
</script>
