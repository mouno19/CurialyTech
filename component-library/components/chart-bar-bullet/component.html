<!-- Goals vs. actuals (bullet bars) · chart-bar-bullet: from the Analytics Component Library (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/atlas-paper.css, and an ancestor with class="cx-atlas-paper". -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<div class="cx-atlas-paper">
<article class="panel">
        <div class="panel-head">
         <div>
          <h3>Goals vs. actuals</h3>
          <p class="panel-caption">Progress layered against a quiet target track</p>
         </div><span class="badge warn">Bullet</span>
        </div>
        <div class="chart-wrap">
         <canvas id="bullet-bar-chart" role="img" aria-label="Horizontal bullet bars comparing actual performance against targets for four teams"></canvas>
        </div>
       </article>
</div>
<script>
Chart.defaults.font.family='"DM Sans", sans-serif';
Chart.defaults.font.size=11;
Chart.defaults.color='#838d85';
const axis={grid:{color:'#edf0e9'},border:{display:false},ticks:{padding:9}};
const noGrid={grid:{display:false},border:{display:false},ticks:{padding:9}};
new Chart(document.getElementById('bullet-bar-chart'),{
      type:'bar',data:{labels:['Growth','Product','Support','Sales'],datasets:[{label:'Target',data:[85,90,80,95],backgroundColor:'#e9efe9',borderRadius:12,barThickness:21,grouped:false,order:2},{label:'Actual',data:[72,84,91,88],backgroundColor:['#246d57','#62ad89','#f2735d','#3e8e71'],borderRadius:12,barThickness:11,grouped:false,order:1}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:8,padding:14}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+ctx.raw+'%'}}},scales:{x:{...axis,max:100,ticks:{callback:v=>v+'%',padding:9}},y:noGrid}}
    });
</script>
