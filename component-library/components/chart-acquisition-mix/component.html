<!-- Acquisition mix over time · chart-acquisition-mix: from the Analytics Component Library (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/atlas-paper.css, and an ancestor with class="cx-atlas-paper". -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<div class="cx-atlas-paper">
<div class="panel">
        <div class="panel-head">
         <div>
          <h3>Acquisition mix</h3>
          <p class="panel-caption">How channels contribute over time</p>
         </div><span class="badge">6 months</span>
        </div>
        <div class="chart-wrap">
         <canvas id="growth-chart" role="img" aria-label="Stacked bar chart showing acquisition channels by month"></canvas>
        </div>
       </div>
</div>
<script>
Chart.defaults.font.family='"DM Sans", sans-serif';
Chart.defaults.font.size=11;
Chart.defaults.color='#838d85';
const axis={grid:{color:'#edf0e9'},border:{display:false},ticks:{padding:9}};
const noGrid={grid:{display:false},border:{display:false},ticks:{padding:9}};
new Chart(document.getElementById('growth-chart'),{
      type:'bar',
      data:{labels:['Jan','Feb','Mar','Apr','May','Jun'],datasets:[
        {label:'Organic',data:[26,31,35,41,47,54],backgroundColor:'#3e8e71',borderRadius:3},
        {label:'Paid',data:[18,20,19,22,21,24],backgroundColor:'#f2735d',borderRadius:3},
        {label:'Referral',data:[9,11,10,13,14,16],backgroundColor:'#f3ca78',borderRadius:3}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:8,padding:15}}},scales:{x:{...noGrid,stacked:true},y:{...axis,stacked:true}}}
    });
</script>
