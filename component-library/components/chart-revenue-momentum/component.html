<!-- Revenue momentum (current vs previous) · chart-revenue-momentum: from the Analytics Component Library (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/atlas-paper.css, and an ancestor with class="cx-atlas-paper". -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<div class="cx-atlas-paper">
<div class="panel">
        <div class="panel-head">
         <div>
          <h3>Revenue momentum</h3>
          <p class="panel-caption">Current period compared with the previous one</p>
         </div><span class="badge coral">Growing</span>
        </div>
        <div class="chart-wrap tall">
         <canvas id="revenue-chart" role="img" aria-label="Line chart comparing current and previous revenue"></canvas>
        </div>
       </div>
</div>
<script>
Chart.defaults.font.family='"DM Sans", sans-serif';
Chart.defaults.font.size=11;
Chart.defaults.color='#838d85';
const axis={grid:{color:'#edf0e9'},border:{display:false},ticks:{padding:9}};
const noGrid={grid:{display:false},border:{display:false},ticks:{padding:9}};
const revenueChart=new Chart(document.getElementById('revenue-chart'),{
      type:'line',
      data:{labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],datasets:[
        {label:'Current period',data:[34,43,39,54,48,65,72],borderColor:'#f2735d',backgroundColor:'rgba(242,115,93,.11)',fill:true,tension:.4,pointRadius:3,pointBackgroundColor:'#f2735d',borderWidth:2.5},
        {label:'Previous period',data:[27,32,36,34,42,45,51],borderColor:'#a9bcb0',borderDash:[5,5],tension:.4,pointRadius:0,borderWidth:2}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:7,padding:18}}},scales:{x:noGrid,y:{...axis,ticks:{callback:v=>'$'+v+'k',padding:9}}}}
    });
</script>
