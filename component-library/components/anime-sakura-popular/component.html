<!-- Popular story rows (Sakura Stream) · anime-sakura-popular: from the Anime archetype: Sakura Stream (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/anime-pastel-sakura-stream.css, and an ancestor with class="cx-anime-pastel-sakura-stream". -->
<div class="cx-anime-pastel-sakura-stream">
<section id="popular" class="section" aria-labelledby="popular-title">
     <div class="section-head">
      <div>
       <div class="overline">
        Community favorites
       </div>
       <h2 id="popular-title" class="section-title">The most loved</h2>
       <p class="section-sub">Good stories are even better shared.</p>
      </div>
     </div>
     <div id="popular-grid" class="popular-grid"></div>
    </section>
<!-- Used by this block's script (elsewhere on the page it came from): -->
<div id="seasonal-grid" class="card-grid"></div>
<div id="recent-list" class="recent-list"></div>
</div>
<script>
const shows=[
      {id:'moonlit',title:'Moonlit Letters',genre:'Romance',year:'2025',rating:'4.9',tag:'NEW STORY',image:'https://images.pexels.com/photos/7532500/pexels-photo-7532500.jpeg',alt:'A tranquil Japanese garden with a stone lantern and cherry blossoms',description:'Two unlikely friends discover that the letters they leave beneath an old cherry tree can reach across time.'},
      {id:'cloud',title:'Beyond the Clouds',genre:'Adventure',year:'2025',rating:'4.8',tag:'ADVENTURE',image:'https://images.pexels.com/photos/35976322/pexels-photo-35976322.jpeg',alt:'Mount Fuji at sunrise above misty mountains',description:'A young sky-cartographer sets off to find the floating islands hidden beyond the edge of every map.'},
      {id:'tea',title:'The Tea House Spell',genre:'Fantasy',year:'2025',rating:'4.9',tag:'EDITOR’S PICK',image:'https://images.pexels.com/photos/31395602/pexels-photo-31395602.jpeg',alt:'Japanese tea house with glowing lanterns and greenery',description:'In a little tea shop between worlds, every cup comes with a touch of unexpected magic.'},
      {id:'garden',title:'Our Little Garden',genre:'Slice of life',year:'2025',rating:'4.7',tag:'COZY PICK',image:'https://images.pexels.com/photos/2187298/pexels-photo-2187298.jpeg',alt:'Rustic bridge surrounded by cherry blossoms in spring',description:'A gentle story about new neighbors, shared gardens, and the joy of growing together.'},
      {id:'starlight',title:'Starlight Postcards',genre:'Fantasy',year:'2024',rating:'4.8',tag:'FAN FAVORITE',image:'https://images.pexels.com/photos/31419072/pexels-photo-31419072.jpeg',alt:'Colorful neon-lit Osaka street at night',description:'A wandering postcard collector follows a trail of stars to a forgotten seaside town.'},
      {id:'summer',title:'Summer After Rain',genre:'Romance',year:'2024',rating:'4.7',tag:'HEARTWARMING',image:'https://images.pexels.com/photos/978344/pexels-photo-978344.jpeg',alt:'Warm sunset over the ocean in Fujisawa, Japan',description:'An unexpected summer friendship becomes a beautiful new beginning.'}
    ];
let genre='All';
let query='';
const image=s=>`<img src="${s.image}" alt="${s.alt}" loading="lazy">`;
function card(s){return `<button type="button" class="anime-card" data-show="${s.id}" aria-label="Read about ${s.title}"><div class="poster">${image(s)}<span class="poster-tag">${s.tag}</span><span class="poster-number">✿</span></div><div class="card-info"><h3>${s.title}</h3><div class="meta"><span>${s.genre}</span><span>·</span><span>${s.year}</span><span class="rating">★ ${s.rating}</span></div></div></button>`}
function smallCard(s){return `<button type="button" class="popular-card" data-show="${s.id}" aria-label="Read about ${s.title}"><div class="thumb">${image(s)}</div><div><h3>${s.title}</h3><p>${s.genre} · ${s.year}</p><span class="meta"><span class="rating">★ ${s.rating}</span> &nbsp; Reader favorite</span></div></button>`}
function pickCard(s){return `<button type="button" class="recent-card" data-show="${s.id}" aria-label="Read about ${s.title}"><div class="thumb">${image(s)}</div><div class="recent-body"><h3>${s.title}</h3><p>${s.genre} · A story to savor</p><span class="text-link">Discover the story ↗</span></div></button>`}
function render(){
      const matches=s=>s.title.toLowerCase().includes(query)||s.genre.toLowerCase().includes(query);
      const seasonal=shows.filter(s=>(genre==='All'||s.genre===genre)&&matches(s));
      const popular=[shows[2],shows[4],shows[1]].filter(matches);
      const picks=[shows[0],shows[3]].filter(matches);
      document.getElementById('seasonal-grid').innerHTML=seasonal.length?seasonal.map(card).join(''):'<div class="empty">No stories found. Try another search or genre. ✿</div>';
      document.getElementById('popular-grid').innerHTML=popular.length?popular.map(smallCard).join(''):'<div class="empty">No matching stories here yet.</div>';
      document.getElementById('recent-list').innerHTML=picks.length?picks.map(pickCard).join(''):'<div class="empty">No matching editor’s picks.</div>';
    }
render();
</script>
