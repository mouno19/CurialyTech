function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function openDetail(i){const s=shows[i];if(!s)return;lastFocus=document.activeElement;document.getElementById("modal-kicker").textContent=`// ${s.type.toUpperCase()} · SERIES FILE`;document.getElementById("modal-title").textContent=s.title;document.getElementById("modal-description").textContent=s.description;document.getElementById("modal-tags").innerHTML=[...s.tags,s.year,s.episodes,`★ ${s.rating}`].map(t=>`<span class="pill">${escapeHTML(t)}</span>`).join("");document.getElementById("detail-backdrop").classList.add("open");document.body.style.overflow="hidden";document.getElementById("modal-close").focus()}

document.getElementById("next-feature").addEventListener("click",()=>{featureIndex=(featureIndex+1)%featured.length;renderFeature()});
