<!-- Side-by-side comparison bars · chart-bar-side-by-side: from the Analytics Component Library (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/atlas-paper.css, and an ancestor with class="cx-atlas-paper". -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<div class="cx-atlas-paper">
<article class="panel">
        <div class="panel-head">
         <div>
          <h3>Side-by-side comparison</h3>
          <p class="panel-caption">Orders by region · this quarter vs. last quarter</p>
         </div><span class="badge">Grouped</span>
        </div>
        <div class="chart-wrap">
         <canvas id="grouped-bar-chart" role="img" aria-label="Grouped bar chart comparing orders across four regions in this quarter and last quarter"></canvas>
        </div>
       </article>
</div>
<script>
Chart.defaults.font.family='"DM Sans", sans-serif';
Chart.defaults.font.size=11;
Chart.defaults.color='#838d85';
const axis={grid:{color:'#edf0e9'},border:{display:false},ticks:{padding:9}};
const noGrid={grid:{display:false},border:{display:false},ticks:{padding:9}};
new Chart(document.getElementById('grouped-bar-chart'),{
      type:'bar',data:{labels:['North','East','South','West'],datasets:[{label:'Last quarter',data:[420,390,310,350],backgroundColor:'#b8daca',borderRadius:5,maxBarThickness:27},{label:'This quarter',data:[510,460,385,430],backgroundColor:'#246d57',borderRadius:5,maxBarThickness:27}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:8,padding:16}}},scales:{x:noGrid,y:axis}}
    });
</script>
