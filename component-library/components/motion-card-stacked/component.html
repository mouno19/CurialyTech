<!-- Stacked cards · motion-card-stacked: from the Motion: Animated cards (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/motion-cards.css, and an ancestor with class="cx-motion-cards". -->
<div class="cx-motion-cards"><div class="w-full">
<article class="demo">
       <div class="demo-head"><span class="demo-number">09 / COMPOSITION</span>
        <h2 class=" demo-title" style="color: rgb(236, 240, 232); font-weight: 600; font-style: normal; font-size: 24px;">Stacked Cards</h2>
        <p class=" demo-description" style="color: rgb(194, 206, 196); font-weight: 400; font-style: normal; font-size: 13px;">Separate overlapping layers with a single tap.</p>
       </div>
       <div class="stage"><button id="stack-card" class="stack-trigger" type="button" aria-label="Separate stacked cards" aria-pressed="false"><span class="stack-layer stack-one"></span><span class="stack-layer stack-two"></span><span class="stack-layer stack-three">Ideas in layers.</span></button>
       </div>
      </article>
</div></div>
<script>
(() => {
function toggleCard(id, attribute) {
      const button=document.getElementById(id);
      button.addEventListener('click',()=>{
        const active=button.classList.toggle('is-active');
        button.setAttribute(attribute,String(active));
      });
    }
toggleCard('stack-card','aria-pressed');
})();
</script>
