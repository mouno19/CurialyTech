<!-- Particle burst button · motion-button-particle-burst: from the Motion: Interactive buttons (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/motion-buttons.css, and an ancestor with class="cx-motion-buttons". -->
<div class="cx-motion-buttons"><div class="w-full">
<article class=" tile" style="background: rgb(32, 36, 33);">
      <div class=" stage particle-stage" style="background: rgb(29, 43, 43);">
       <button id="particle" type="button" class=" demo particle" style="background: rgb(112, 229, 207);"><span style="color: rgb(16, 48, 41); font-weight: 700; font-style: normal; font-size: 16px;">Make a little noise ✳</span></button>
      </div>
      <div class="tile-meta">
       <span class="number">06</span>
       <div>
        <h2 style="color: rgb(244, 244, 238); font-weight: 700; font-style: normal; font-size: 24px;">Particle Burst</h2>
        <p style="color: rgb(174, 183, 174); font-weight: 400; font-style: normal; font-size: 16px;">A small celebration with every click.</p>
       </div>
      </div>
     </article>
</div></div>
<script>
(() => {
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
document.getElementById('particle').addEventListener('click', e => {
      if (reducedMotion.matches) return;
      const button = e.currentTarget;
      for (let i = 0; i < 14; i++) {
        const spark = document.createElement('span');
        const angle = (i / 14) * Math.PI * 2;
        const distance = 65 + (i % 3) * 18;
        spark.className = 'spark';
        spark.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
        spark.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
        spark.style.setProperty('--spark-color', i % 2 ? '#f9cd76' : '#70e5cf');
        button.appendChild(spark);
        spark.addEventListener('animationend', () => spark.remove(), {once:true});
      }
    });
})();
</script>
