<!-- Category ranking (horizontal bars) · chart-category-ranking: from the Analytics Component Library (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/atlas-paper.css, and an ancestor with class="cx-atlas-paper". -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<div class="cx-atlas-paper">
<div class="panel">
        <div class="panel-head">
         <div>
          <h3>Category ranking</h3>
          <p class="panel-caption">Revenue index by product category</p>
         </div>
        </div>
        <div class="chart-wrap">
         <canvas id="category-chart" role="img" aria-label="Horizontal bar chart ranking product categories"></canvas>
        </div>
       </div>
</div>
<script>
Chart.defaults.font.family='"DM Sans", sans-serif';
Chart.defaults.font.size=11;
Chart.defaults.color='#838d85';
const axis={grid:{color:'#edf0e9'},border:{display:false},ticks:{padding:9}};
const noGrid={grid:{display:false},border:{display:false},ticks:{padding:9}};
new Chart(document.getElementById('category-chart'),{
      type:'bar',
      data:{labels:['Home','Apparel','Beauty','Electronics','Accessories'],datasets:[{data:[82,69,57,44,32],backgroundColor:['#f2735d','#f49c84','#f5b7a5','#f5cdbf','#f7e2d9'],borderRadius:5,barPercentage:.58}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:axis,y:noGrid}}
    });
</script>
