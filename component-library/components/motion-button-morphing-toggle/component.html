<!-- Morphing toggle · motion-button-morphing-toggle: from the Motion: Interactive buttons (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/motion-buttons.css, and an ancestor with class="cx-motion-buttons". -->
<div class="cx-motion-buttons"><div class="w-full">
<article class=" tile" style="background: rgb(32, 36, 33);">
      <div class=" stage toggle-stage" style="background: rgb(228, 235, 229);">
       <button id="toggle" type="button" class=" toggle" aria-label="Morphing toggle" aria-pressed="false" style="background: rgb(158, 173, 162);"><span class="toggle-track"><span class=" toggle-word toggle-off" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">OFF</span><span class=" toggle-word toggle-on" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">ON</span><span class="toggle-thumb" aria-hidden="true"></span></span></button>
      </div>
      <div class="tile-meta">
       <span class="number">09</span>
       <div>
        <h2 style="color: rgb(244, 244, 238); font-weight: 700; font-style: normal; font-size: 24px;">Morphing Toggle</h2>
        <p style="color: rgb(174, 183, 174); font-weight: 400; font-style: normal; font-size: 16px;">Two states connected by one fluid gesture.</p>
       </div>
      </div>
     </article>
</div></div>
<script>
(() => {
document.getElementById('toggle').addEventListener('click', e => {
      const button = e.currentTarget;
      button.setAttribute('aria-pressed', String(button.getAttribute('aria-pressed') !== 'true'));
    });
})();
</script>
