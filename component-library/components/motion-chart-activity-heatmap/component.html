<!-- Activity heatmap · motion-chart-activity-heatmap: from the Motion: Animated data visualizations (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/motion-charts.css, and an ancestor with class="cx-motion-charts". -->
<div class="cx-motion-charts"><div class="app-shell">
<article class=" chart-card" style="background: rgb(25, 37, 34);">
      <div class="card-top"><span class="chart-number">07</span>
       <div>
        <h2 style="color: rgb(240, 243, 233); font-weight: 700; font-style: normal; font-size: 21px;">Activity heatmap</h2>
        <p class=" card-desc" style="color: rgb(165, 184, 174); font-weight: 400; font-style: normal; font-size: 14px;">Daily intensity across recent weeks.</p>
       </div>
      </div>
      <svg id="heat" class="viz" role="img" aria-label="Activity heatmap by weekday and week"></svg>
     </article>
</div></div>
<script>
(() => {
const NS='http://www.w3.org/2000/svg';
const samples={
    saas:{label:'SaaS growth',series:[28,35,32,48,55,53,72,86],categories:[46,78,61,91,55],segments:[45,27,18,10],radial:[86,72,64,91],kpi:78,heat:Array.from({length:42},(_,i)=>((i*17+Math.floor(i/7)*11)%91)+9),pulse:[40,49,44,58,52,65,58,73,68,76,72,83],funnel:[12000,7200,3100,980]},
    finance:{label:'Financial outlook',series:[42,38,47,45,59,68,64,79],categories:[83,62,75,48,67],segments:[38,31,20,11],radial:[74,89,68,82],kpi:84,heat:Array.from({length:42},(_,i)=>((i*23+Math.floor(i/7)*7)%88)+12),pulse:[55,50,62,57,65,59,72,69,79,74,77,85],funnel:[18600,10400,4700,1650]},
    ai:{label:'AI platform',series:[18,22,37,42,57,66,81,94],categories:[72,88,56,79,63],segments:[51,25,16,8],radial:[93,78,85,69],kpi:91,heat:Array.from({length:42},(_,i)=>((i*31+Math.floor(i/7)*13)%90)+10),pulse:[25,39,35,51,48,64,59,75,72,81,79,92],funnel:[24000,13200,5900,2200]}
  };
const state={data:structuredClone(samples.saas),selected:null,live:null};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function svg(id){const el=document.getElementById(id),w=Math.max(300,Math.round(el.getBoundingClientRect().width)),h=Math.round(el.getBoundingClientRect().height)||230;el.setAttribute('viewBox',`0 0 ${w} ${h}`);el.replaceChildren();return {el,w,h}}
function node(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));if(parent)parent.appendChild(e);return e}
function txt(p,x,y,text,extra={}){const e=node('text',{x,y,...extra},p);e.textContent=text;return e}
function tip(el,text){node('title',{},el).textContent=text}
function animate(el,attrs,duration=850,delay=0){if(reduce){Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));return}setTimeout(()=>{el.style.transition=`all ${duration}ms cubic-bezier(.22,.8,.22,1)`;requestAnimationFrame(()=>Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v)))},delay)}
function heatChart(){const {el,w,h}=svg('heat'),d=state.data.heat,days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],left=42,top=20,gap=5,cell=Math.min(23,(w-left-12-5*gap)/6,(h-top-28-6*gap)/7);days.forEach((day,i)=>txt(el,0,top+i*(cell+gap)+cell*.73,day));for(let week=0;week<6;week++){txt(el,left+week*(cell+gap)+cell/2,h-5,`W${week+1}`,{'text-anchor':'middle'});for(let day=0;day<7;day++){const v=d[week*7+day],r=node('rect',{x:left+week*(cell+gap),y:top+day*(cell+gap),width:cell,height:cell,rx:4,fill:'#28453a',opacity:0},el);tip(r,`Week ${week+1}, ${days[day]}: ${v} events`);animate(r,{fill:v>72?'#b8f5d5':v>48?'#6bd1a2':v>25?'#3d9874':'#2b654f',opacity:1},420,(week*7+day)*22)}}}
heatChart();
})();
</script>
