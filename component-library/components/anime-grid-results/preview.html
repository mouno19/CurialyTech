const state={category:"All",search:"",genres:new Set(),formats:new Set(),statuses:new Set(),year:"all",rating:0,sort:"popular",page:1};
const perPage=10,$=id=>document.getElementById(id);
function iconRefresh(){if(window.lucide)lucide.createIcons()}
function filtered(){let list=anime.filter(a=>{let q=state.search.toLowerCase();return (!q||[a.title,a.description,...a.genres].some(t=>t.toLowerCase().includes(q)))&&(!state.genres.size||[...state.genres].some(g=>a.genres.includes(g)))&&(!state.formats.size||state.formats.has(a.format))&&(!state.statuses.size||state.statuses.has(a.status))&&(state.year==="all"||(state.year==="2020s"?a.year>=2020:state.year==="2010s"?a.year>=2010&&a.year<2020:a.year<2010))&&a.rating>=state.rating&&(state.category==="All"||state.category==="Trending"&&a.popularity>=84||state.category==="Top Rated"&&a.rating>=8.9||state.category==="New Releases"&&a.year>=2023)});
      return list.sort((a,b)=>state.sort==="rating"?b.rating-a.rating||b.popularity-a.popularity:state.sort==="newest"?b.year-a.year||b.popularity-a.popularity:state.sort==="oldest"?a.year-b.year:state.sort==="az"?a.title.localeCompare(b.title):b.popularity-a.popularity)}
function render(){const list=filtered(),pages=Math.ceil(list.length/perPage);state.page=Math.min(state.page,Math.max(1,pages));$("result-count").textContent=`${list.length} title${list.length===1?"":"s"}`;$("results-title").firstChild.textContent=state.category==="All"?"Discover anime ":state.category+" ";
      const pageList=list.slice((state.page-1)*perPage,state.page*perPage);
      $("anime-grid").innerHTML=pageList.length?pageList.map(a=>`<article class="card"><button class="poster-button" type="button" data-id="${a.id}" aria-label="View details for ${a.title}"><div class="poster" style="--c1:${a.colors[0]};--c2:${a.colors[1]};--c3:${a.colors[2]}"><div class="poster-shape"></div><span class="poster-glyph" aria-hidden="true">${a.glyph}</span><span class="poster-title"><small>Anime grid / ${a.year}</small>${a.title}</span></div><span class="corner-badge"><i data-lucide="star"></i> ${a.rating.toFixed(1)}</span><span class="type-badge">${a.format.toUpperCase()}</span></button><div class="card-info"><h3 class="card-title" title="${a.title}">${a.title}</h3><div class="card-meta"><span>${a.year}</span><span class="dot"></span><span>${a.episodes} ${a.format==="Movie"?"film":"eps"}</span></div><div class="genres">${a.genres.slice(0,2).map(g=>`<span class="genre-tag">${g}</span>`).join("")}</div><div class="status"><span class="status-dot ${a.status.toLowerCase()}"></span>${a.status}</div></div></article>`).join(""):`<div class="empty" style="grid-column:1/-1"><i data-lucide="search-x"></i><h3>No anime found</h3><p>Try adjusting your search or clearing a filter.</p></div>`;
      $("pagination").innerHTML=pages>1?`<button data-page="${state.page-1}" ${state.page===1?"disabled":""} aria-label="Previous page"><i data-lucide="chevron-left"></i></button>${Array.from({length:pages},(_,i)=>`<button class=" ${state.page===i+1?"active":""}" data-page="${i+1}" ${state.page===i+1?'aria-current="page"':""}>${i+1}</button>`).join("")}<button data-page="${state.page+1}" ${state.page===pages?"disabled":""} aria-label="Next page"><i data-lucide="chevron-right"></i></button>`:"";
      const chips=[...[...state.genres].map(x=>["genres",x]),...[...state.formats].map(x=>["formats",x]),...[...state.statuses].map(x=>["statuses",x])];if(state.year!=="all")chips.push(["year",state.year]);if(state.rating)chips.push(["rating",state.rating+"+ rating"]);$("active-chips").innerHTML=chips.map(([k,v])=>`<button class="chip" data-chip="${k}" data-value="${v}" aria-label="Remove ${v} filter">${v}<i data-lucide="x"></i></button>`).join("");iconRefresh()}

$("active-chips").addEventListener("click",e=>{const b=e.target.closest("[data-chip]");if(!b)return;let k=b.dataset.chip,v=b.dataset.value;if(k==="year"){$("year-filter").value="all";state.year="all"}else if(k==="rating"){$("rating-filter").value=0;$("rating-value").textContent="Any";state.rating=0}else{state[k].delete(v);const input=[...document.querySelectorAll("[data-filter]")].find(x=>x.dataset.filter===k&&x.value===v);if(input)input.checked=false}state.page=1;render()});
