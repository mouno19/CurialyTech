<!-- Table with in-cell bars · table-chart-in-cell-bars: from the Analytics Component Library (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/atlas-paper.css, and an ancestor with class="cx-atlas-paper". -->
<div class="cx-atlas-paper">
<article class="table-chart-card">
        <h3>01 / In-cell bars</h3>
        <p class="panel-caption">Channel visits · ranked by volume</p>
        <div class="table-scroll">
         <table>
          <thead>
           <tr>
            <th scope="col">Channel</th>
            <th scope="col">Relative volume</th>
            <th scope="col">Visits</th>
           </tr>
          </thead>
          <tbody>
           <tr>
            <td>Organic</td>
            <td class="bar-cell">
             <div class="bar-track" role="img" aria-label="Organic: 100 percent of maximum">
              <span style="width:100%"></span>
             </div></td>
            <td>42,800</td>
           </tr>
           <tr>
            <td>Direct</td>
            <td class="bar-cell">
             <div class="bar-track" role="img" aria-label="Direct: 76 percent of maximum">
              <span style="width:76%"></span>
             </div></td>
            <td>32,500</td>
           </tr>
           <tr>
            <td>Paid</td>
            <td class="bar-cell">
             <div class="bar-track" role="img" aria-label="Paid: 53 percent of maximum">
              <span style="width:53%"></span>
             </div></td>
            <td>22,700</td>
           </tr>
           <tr>
            <td>Referral</td>
            <td class="bar-cell">
             <div class="bar-track" role="img" aria-label="Referral: 29 percent of maximum">
              <span style="width:29%"></span>
             </div></td>
            <td>12,400</td>
           </tr>
          </tbody>
         </table>
        </div>
        <p class="table-chart-note">Bars share a common maximum; the right column keeps values precise.</p>
       </article>
</div>
