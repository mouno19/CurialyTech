<!-- KPI metric cards · kpi-metric-cards: from the Analytics Component Library (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/atlas-paper.css, and an ancestor with class="cx-atlas-paper". -->
<script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
<div class="cx-atlas-paper">
<div class="grid four">
       <div class="metric">
        <div class="metric-top">
         Total revenue <span class="icon-box"><i data-lucide="wallet"></i></span>
        </div>
        <div class="metric-value" id="revenue-value">
         $48,294
        </div>
        <div class="delta"><b id="revenue-delta">↑ 12.8%</b> vs. previous period
        </div>
       </div>
       <div class="metric">
        <div class="metric-top">
         Active users <span class="icon-box"><i data-lucide="users"></i></span>
        </div>
        <div class="metric-value" id="users-value">
         24,892
        </div>
        <div class="delta"><b id="users-delta">↑ 8.2%</b> vs. previous period
        </div>
       </div>
       <div class="metric">
        <div class="metric-top">
         Conversion rate <span class="icon-box"><i data-lucide="mouse-pointer-2"></i></span>
        </div>
        <div class="metric-value" id="conversion-value">
         4.86%
        </div>
        <div class="delta"><b id="conversion-delta">↑ 2.4%</b> vs. previous period
        </div>
       </div>
       <div class="metric">
        <div class="metric-top">
         Avg. order value <span class="icon-box"><i data-lucide="shopping-bag"></i></span>
        </div>
        <div class="metric-value" id="order-value">
         $126.40
        </div>
        <div class="delta"><b id="order-delta">↑ 5.1%</b> vs. previous period
        </div>
       </div>
      </div>
</div>
<script>
lucide.createIcons();
</script>
