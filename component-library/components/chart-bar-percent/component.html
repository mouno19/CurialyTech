<!-- Channel composition (100% stacked) · chart-bar-percent: from the Analytics Component Library (Curialy component library). Sample data is fictional.
     Needs the stylesheet styles/atlas-paper.css, and an ancestor with class="cx-atlas-paper". -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<div class="cx-atlas-paper">
<article class="panel">
        <div class="panel-head">
         <div>
          <h3>Channel composition</h3>
          <p class="panel-caption">A normalized view of every segment's share</p>
         </div><span class="badge">100% stacked</span>
        </div>
        <div class="chart-wrap">
         <canvas id="percent-bar-chart" role="img" aria-label="One hundred percent stacked bars showing channel share across four quarters"></canvas>
        </div>
       </article>
</div>
<script>
Chart.defaults.font.family='"DM Sans", sans-serif';
Chart.defaults.font.size=11;
Chart.defaults.color='#838d85';
const axis={grid:{color:'#edf0e9'},border:{display:false},ticks:{padding:9}};
const noGrid={grid:{display:false},border:{display:false},ticks:{padding:9}};
new Chart(document.getElementById('percent-bar-chart'),{
      type:'bar',data:{labels:['Q1','Q2','Q3','Q4'],datasets:[{label:'Organic',data:[48,52,55,59],backgroundColor:'#246d57',borderRadius:4},{label:'Paid',data:[32,29,27,24],backgroundColor:'#f2735d',borderRadius:4},{label:'Referral',data:[20,19,18,17],backgroundColor:'#f3ca78',borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:8,padding:14}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+ctx.raw+'%'}}},scales:{x:{...noGrid,stacked:true},y:{...axis,stacked:true,max:100,ticks:{callback:v=>v+'%',padding:9}}}}
    });
</script>
