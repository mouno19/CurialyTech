server {
    server_name curialy.tech www.curialy.tech;

    # The Developer API (/v1, /api/v1): model replies stream for minutes, so no response buffering
    # and ten-minute reads (the default 60 s would cut long, unstreamed replies off).
    location ~ ^/(api/)?v1/ {
        client_max_body_size 30m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        # Uploads (attachments up to 25 MB, dictation up to 6 MB) stream straight to the app, which
        # holds them in memory: nginx neither rejects them at its 1 MB default nor writes them to disk.
        client_max_body_size 30m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/curialy.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/curialy.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.curialy.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = curialy.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name curialy.tech www.curialy.tech;
    return 404; # managed by Certbot




}